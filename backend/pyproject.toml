[project]
name = "document-processing-backend"
version = "0.1.0"
description = "Idempotent ZIP upload + stats backend (FastAPI, SQLAlchemy async, Alembic)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.116.0",
    "uvicorn[standard]==0.35.0",
    "sqlalchemy==2.0.38",
    "aiosqlite==0.22.1",
    "alembic==1.18.4",
    "python-multipart==0.0.32",
    "pydantic-settings>=2.5,<3",
]

[dependency-groups]
dev = [
    "pytest==8.3.5",
    "pytest-asyncio==1.3.0",
    "pytest-cov>=6,<8",
    "httpx==0.28.1",
    "ruff>=0.8,<1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F - pycodestyle/pyflakes, I - isort, UP - pyupgrade (PEP 604), B - bugbear, SIM - simplify
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# Depends/Query в дефолтах аргументов - идиома FastAPI, не баг (B008).
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.File"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
# SQLAlchemy async ходит через greenlet - без этого код после await не учитывается.
concurrency = ["thread", "greenlet"]

[tool.coverage.report]
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
