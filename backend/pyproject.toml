[project]
name = "document-processing-backend"
version = "0.1.0"
description = "Document processing service with idempotent ZIP upload"
requires-python = ">=3.12"

dependencies = [
    "fastapi==0.116.0",
    "uvicorn==0.35.0",
    "sqlalchemy==2.0.38",
    "aiosqlite==0.22.1",
    "alembic==1.18.4",
    "python-multipart==0.0.32",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
    "pytest-asyncio==1.3.0",
    "httpx==0.28.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"